<style>
  body { -webkit-tap-highlight-color: transparent; }

  /* ===== Bus screen: fixed 1600x900 canvas scaled to any display ===== */
  #screenWrap { position: fixed; inset: 0; background: #05070c; display: none; align-items: center; justify-content: center; overflow: hidden; z-index: 40; }
  #stage { width: 1600px; height: 900px; transform-origin: center center; position: relative; flex-shrink: 0; }
  .scr { width: 100%; height: 100%; border-radius: 26px; overflow: hidden; position: relative;
    background: linear-gradient(180deg, #e9edf2 0%, #d7dde5 100%); color: #0f172a; font-family: 'IBM Plex Sans Arabic', sans-serif; }

  .ticker { white-space: nowrap; animation: tick 28s linear infinite; }
  @keyframes tick { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .pulse-dot { animation: pd 1.6s ease-in-out infinite; } @keyframes pd { 50% { opacity: .35; } }

<!-- ================= ADMIN APP ================= -->

<script>
/* =====================================================================
   رحلات — Trip information system for bus passenger screens (demo)
   - Admin page: bilingual form per vehicle (as the client's mock-up).
   - Screen page: 16:9 passenger display per vehicle (#/screen/<code>),
     auto-scaled to any screen, live-updated when admin presses Update
     (cross-tab sync via storage events + BroadcastChannel in this demo;
     production uses a realtime database so updates reach every bus).
   - Countdown is computed on the screen itself → keeps running offline.
   ===================================================================== */

/* ---------------- REFERENCE DATA ---------------- */
const CITIES = {
  jeddah:  { ar:'جدة',            en:'Jeddah',   ll:[21.4858, 39.1925] },
  makkah:  { ar:'مكة المكرمة',    en:'Makkah',   ll:[21.3891, 39.8579] },
  madinah: { ar:'المدينة المنورة', en:'Madinah',  ll:[24.5247, 39.5692] },
  riyadh:  { ar:'الرياض',         en:'Riyadh',   ll:[24.7136, 46.6753] },
  dammam:  { ar:'الدمام',         en:'Dammam',   ll:[26.4207, 50.0888] },
  abha:    { ar:'أبها',           en:'Abha',     ll:[18.2465, 42.5117] },
  jazan:   { ar:'جازان',          en:'Jazan',    ll:[16.8892, 42.5511] },
  sanaa:   { ar:'صنعاء',          en:'Sanaa',    ll:[15.3694, 44.1910] },
  aden:    { ar:'عدن',            en:'Aden',     ll:[12.7855, 45.0187] },
  taiz:    { ar:'تعز',            en:'Taiz',     ll:[13.5795, 44.0209] },
  hodeidah:{ ar:'الحديدة',        en:'Hodeidah', ll:[14.7978, 42.9545] },
  marib:   { ar:'مأرب',           en:'Marib',    ll:[15.4590, 45.3253] },
};
// intermediate waypoints so routes follow the coast/highways instead of straight lines
const VIA = {
  'jeddah-sanaa': ['makkah', 'abha', 'jazan'], 'riyadh-aden': ['abha', 'sanaa', 'taiz'],
  'jeddah-aden': ['abha', 'jazan', 'hodeidah', 'taiz'], 'makkah-sanaa': ['abha', 'jazan'],
  'riyadh-sanaa': ['abha'], 'jeddah-madinah': [], 'makkah-madinah': [], 'dammam-riyadh': [],
};

/* ---------------- HELPERS ---------------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('تعذر الحفظ: مساحة التخزين ممتلئة', 'fa-triangle-exclamation', 'text-red-300'); } }
};
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const toLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const at = (date, time) => new Date(`${date}T${time || '00:00'}`);
function hm(ms) { const m = Math.max(0, Math.round(ms / 6e4)); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; }
function hms(ms) { const s = Math.max(0, Math.floor(ms / 1e3)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; }
function toast(msg, icon = 'fa-circle-check', color = 'text-emerald-400') {
  const t = $('#toast'); t.innerHTML = `<i class="fa-solid ${icon} ${color}"></i><span>${msg}</span>`;
  t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2500);
}
const city = k => CITIES[k] || { ar: k, en: k, ll: null };

/* ---------------- DATA ---------------- */
function defaultLogo(c1 = '#d4a84f', c2 = '#a87b22', bg = '#0f172a') {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="120" height="120" rx="28" fill="${bg}"/><circle cx="60" cy="60" r="38" fill="url(#g)"/><path d="M38 70h44v8H38zM42 46h36a6 6 0 0 1 6 6v14H36V52a6 6 0 0 1 6-6z" fill="${bg}"/><circle cx="46" cy="80" r="5" fill="${bg}"/><circle cx="74" cy="80" r="5" fill="${bg}"/></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(svg);
}
const svgUri = s => 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(s)));
const LOGOS = {
  nukhba: svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="a" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#b8862b"/><stop offset=".55" stop-color="#e9c46a"/><stop offset="1" stop-color="#f6e0a0"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13264d"/><stop offset="1" stop-color="#0a1630"/></linearGradient></defs><rect width="120" height="120" rx="26" fill="url(#b)"/><path d="M20 66C40 60 60 46 80 22C76 44 60 60 34 72Z" fill="url(#a)" opacity=".75"/><path d="M24 80C46 75 72 60 98 32C88 58 66 76 38 86Z" fill="url(#a)"/><path d="M30 94C54 91 78 80 100 56C90 78 70 92 44 99Z" fill="url(#a)" opacity=".85"/></svg>`),
  salam: svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#065f46"/></linearGradient></defs><rect width="120" height="120" rx="26" fill="url(#g)"/><circle cx="60" cy="38" r="15" fill="#fde68a"/><path d="M22 102Q50 70 56 44L64 44Q70 70 98 102Z" fill="#fff"/><path d="M60 50V58M60 66V76M60 84V98" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/></svg>`),
  aman: svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><rect width="120" height="120" rx="26" fill="url(#g)"/><path d="M60 18L94 30V58C94 80 79 95 60 104C41 95 26 80 26 58V30Z" fill="#fff"/><path d="M60 26L86 35.5V58C86 75 75 87 60 95Z" fill="#dbeafe"/><path d="M44 60L56 72L78 46" fill="none" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`),
};
function monogram(name) {
  const word = String(name || '').replace(/^\s*(شركة|مؤسسة)\s+/, '').trim();
  const ch = (word.replace(/^ال/, '')[0] || 'ش');
  const pal = [['#7c3aed', '#4c1d95'], ['#e11d48', '#881337'], ['#ea580c', '#7c2d12'], ['#0891b2', '#164e63'], ['#4f46e5', '#312e81']];
  const [c1, c2] = pal[[...word].reduce((s, c) => s + c.charCodeAt(0), 0) % pal.length];
  return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="120" height="120" rx="26" fill="url(#g)"/><circle cx="60" cy="60" r="38" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/><text x="60" y="78" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="52" font-weight="700" fill="#fff">${ch}</text></svg>`);
}
const PLATFORM = { ar: 'منصة رحلات', en: 'Rihla Platform', owner: { user: 'admin', pass: '1234' } };
function seed() {
  const now = new Date(), H = h => new Date(now.getTime() + h * 36e5);
  const trip = (code, from, to, startH, durH, d1, d2, card, no, tel) => {
    const s = H(startH), e = H(startH + durH);
    return { code, from, to, fromDate: toLocal(s), fromTime: toTime(s), toDate: toLocal(e), toTime: toTime(e),
      driverEn: d1[1], driverAr: d1[0], asstEn: d2[1], asstAr: d2[0], card, tripNo: no, contact: tel, periodic: 'no', updated: Date.now() };
  };
  const day = d => toLocal(new Date(now.getTime() - d * 864e5));
  return { companies: [
    { id:'nukhba', ar:'شركة النخبة للنقل الجماعي', en:'Al-Nukhba Passenger Transport', logo: LOGOS.nukhba, user:'nukhba', pass:'1234', active:true, since: day(140), vehicles: [
      trip('236', 'jeddah', 'sanaa', -15.2, 50, ['عبد الرحمن سالم الغامدي', 'Abdulrahman Salem Al-Ghamdi'], ['رشيد محمد عبد الله محمود', 'Rashid Mohammed Abdullah Mahmoud'], '7150067820', 'TR-RK-25-1876', '0552614714'),
      trip('525', 'riyadh', 'aden', -6, 38, ['خالد يوسف الحربي', 'Khalid Yousef Al-Harbi'], ['سعيد أحمد باوزير', 'Saeed Ahmed Bawazir'], '7150091144', 'TR-RA-25-2210', '0552614714'),
      trip('118', 'makkah', 'madinah', 1.5, 5, ['فهد عبد العزيز الشهري', 'Fahad Abdulaziz Al-Shehri'], ['ماجد علي القحطاني', 'Majed Ali Al-Qahtani'], '7150033012', 'TR-MM-25-0417', '0552614714'),
      trip('342', 'dammam', 'riyadh', -6.5, 4.5, ['ناصر حمد الدوسري', 'Nasser Hamad Al-Dosari'], ['تركي سعد العتيبي', 'Turki Saad Al-Otaibi'], '7150054478', 'TR-DR-25-0933', '0552614714'),
    ] },
    { id:'salam', ar:'شركة السلام للنقل البري', en:'Al-Salam Land Transport', logo: LOGOS.salam, user:'salam', pass:'1234', active:true, since: day(65), vehicles: [
      trip('710', 'jeddah', 'aden', -10, 44, ['عمر حسن باعبود', 'Omar Hassan Baaboud'], ['ياسر صالح العمودي', 'Yasser Saleh Al-Amoudi'], '7150120077', 'SL-JA-25-0312', '0567781020'),
      trip('714', 'riyadh', 'sanaa', 3, 30, ['منصور علي الزهراني', 'Mansour Ali Al-Zahrani'], ['هاني محمد الشريف', 'Hani Mohammed Al-Sharif'], '7150120081', 'SL-RS-25-0318', '0567781020'),
    ] },
    { id:'aman', ar:'شركة الأمان للرحلات', en:'Al-Aman Trips', logo: LOGOS.aman, user:'aman', pass:'1234', active:false, since: day(20), vehicles: [
      trip('901', 'makkah', 'sanaa', -30, 26, ['صالح عبد الله المطيري', 'Saleh Abdullah Al-Mutairi'], ['بدر فهد السبيعي', 'Badr Fahad Al-Subaie'], '7150200155', 'AM-MS-25-0044', '0590012233'),
    ] },
  ] };
}
let db = store.get('rihla_db3', null);
if (!db || !Array.isArray(db.companies)) { db = seed(); store.set('rihla_db3', db); }
let session = store.get('rihla_session', null);
const setSession = s => { session = s; store.set('rihla_session', s); };
const company = id => db.companies.find(c => c.id === id);
const cur = () => session && company(session.cid);
const veh = (code, co = cur()) => co && co.vehicles.find(v => v.code === code);
const screenUrl = (co, code) => `#/screen/${encodeURIComponent(co.id)}/${encodeURIComponent(code)}`;
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('rihla') : null;
function save(code) { store.set('rihla_db3', db); if (bc) bc.postMessage({ code, t: Date.now() }); }

function tripState(v, now = Date.now()) {
  const s = at(v.fromDate, v.fromTime).getTime(), e = at(v.toDate, v.toTime).getTime();
  if (!(e > s)) return { key:'invalid', s, e };
  if (now < s) return { key:'scheduled', s, e, left: s - now };
  if (now >= e) return { key:'arrived', s, e };
  return { key:'enroute', s, e, left: e - now, pct: (now - s) / (e - s) };
}
const STATE_UI = {
  scheduled: { ar:'لم تنطلق بعد', cls:'bg-amber-50 text-amber-800', icon:'fa-regular fa-clock' },
  enroute:   { ar:'في الطريق',    cls:'bg-emerald-50 text-emerald-700', icon:'fa-solid fa-route' },
  arrived:   { ar:'وصلت',         cls:'bg-ink-100 text-ink-700', icon:'fa-solid fa-flag-checkered' },
  invalid:   { ar:'تواريخ غير صحيحة', cls:'bg-red-50 text-red-700', icon:'fa-solid fa-triangle-exclamation' },
};

/* ---------------- ROUTER ---------------- */
function route(keepScroll) {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const page = parts[0];
  stopScreen();
  if (page === 'screen') {
    const co = company(parts[1]), v = co && veh(parts[2], co);
    if (v) {
      $('#app').style.display = 'none'; $('#screenWrap').style.display = 'flex';
      document.title = `شاشة الحافلة ${v.code} — ${co.ar}`;
      return startScreen(co.id, v.code);
    }
  }
  $('#app').style.display = ''; $('#screenWrap').style.display = 'none';
  document.title = 'منصة رحلات | إدارة شاشات معلومات الرحلة للحافلات';
  if (!session) { renderChrome('login'); renderLogin(); }
  else if (session.role === 'owner' && (!session.cid || page === 'admin')) { if (session.cid) setSession({ role: 'owner' }); renderChrome('owner'); renderAdmin(); }
  else if (!cur() || (session.role === 'company' && !cur().active)) { setSession(null); return route(); }
  else { renderChrome('company'); if (page === 'edit' && veh(parts[1])) renderEdit(parts[1]); else renderHome(); }
  if (!keepScroll) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => route());
function renderChrome(mode) {
  $('#hdr').style.display = mode === 'login' ? 'none' : '';
  $('#btnSettings').style.display = mode === 'company' ? '' : 'none';
  const ob = $('#ownerBar'), co = cur();
  ob.classList.toggle('hidden', !(mode === 'company' && session.role === 'owner'));
  if (mode === 'company') {
    $('#ownerBarTxt').textContent = `أنت مالك المنصة وتتصفح لوحة: ${co.ar}`;
    $('#hdrName').textContent = co.ar; $('#hdrSub').textContent = 'لوحة إدارة شاشات الرحلات'; $('#hdrHome').href = '#/';
    $('#hdrLogo').innerHTML = co.logo ? `<img src="${co.logo}" alt="" class="w-full h-full object-cover">` : '<i class="fa-solid fa-bus"></i>';
  } else if (mode === 'owner') {
    $('#hdrName').textContent = PLATFORM.ar; $('#hdrSub').textContent = 'لوحة مالك المنصة'; $('#hdrHome').href = '#/admin';
    $('#hdrLogo').innerHTML = '<i class="fa-solid fa-satellite-dish"></i>';
  }
}
const renderHeader = () => renderChrome('company');

/* ---------------- LOGIN ---------------- */

function login(u, p) {
  const fail = m => { const el = $('#lErr'); if (el) { el.classList.remove('hidden'); el.querySelector('span').textContent = m; } };
  if (!u || !p) return fail('أدخل اسم المستخدم وكلمة المرور');
  if (u.toLowerCase() === PLATFORM.owner.user && p === PLATFORM.owner.pass) { setSession({ role: 'owner' }); location.hash = '#/admin'; route(); return toast('مرحباً بك في لوحة مالك المنصة', 'fa-user-shield'); }
  const co = db.companies.find(c => c.user.toLowerCase() === u.toLowerCase());
  if (!co || co.pass !== p) return fail('اسم المستخدم أو كلمة المرور غير صحيحة');
  if (!co.active) return fail('حساب هذه الشركة موقوف. تواصل مع إدارة المنصة.');
  setSession({ role: 'company', cid: co.id }); location.hash = '#/'; route(); toast(`مرحباً ${co.ar}`);
}

/* Map: Leaflet + OpenStreetMap, with an offline SVG fallback */
const maps = new WeakMap();
function routePoints(v) {
  const key = `${v.from}-${v.to}`, rev = `${v.to}-${v.from}`;
  let via = VIA[key] || (VIA[rev] ? [...VIA[rev]].reverse() : []);
  return [v.from, ...via, v.to].map(k => city(k).ll).filter(Boolean);
}
function drawMap(el, v, mini) {
  if (!el) return;
  const pts = routePoints(v); if (pts.length < 2) return;
  if (window.L) {
    try {
      let m = maps.get(el);
      if (!m) {
        m = L.map(el, { zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12, attribution: '© OpenStreetMap' }).addTo(m);
        maps.set(el, m);
      }
      m.eachLayer(l => { if (!(l instanceof L.TileLayer)) m.removeLayer(l); });
      L.polyline(pts, { color: '#ffffff', weight: 9, opacity: .9 }).addTo(m);
      L.polyline(pts, { color: '#2563eb', weight: 5 }).addTo(m);
      const dot = (ll, c) => L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: c, fillOpacity: 1 }).addTo(m);
      dot(pts[0], '#16a34a'); dot(pts[pts.length - 1], '#dc2626');
      const st = tripState(v);
      if (st.key === 'enroute') { const p = along(pts, st.pct); L.circleMarker(p, { radius: 11, color: '#fff', weight: 4, fillColor: '#f59e0b', fillOpacity: 1 }).addTo(m); }
      m.invalidateSize(); m.fitBounds(L.latLngBounds(pts).pad(0.25), { animate: false });
      return;
    } catch (e) { /* fall through to SVG */ }
  }
  el.innerHTML = svgMap(pts, v);
}
function along(pts, f) {
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let goal = tot * Math.min(1, Math.max(0, f));
  for (let i = 0; i < seg.length; i++) { if (goal <= seg[i]) { const r = goal / seg[i]; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r]; } goal -= seg[i]; }
  return pts[pts.length - 1];
}
function svgMap(pts, v) {
  const la = pts.map(p => p[0]), lo = pts.map(p => p[1]);
  const pad = 1.5, minLa = Math.min(...la) - pad, maxLa = Math.max(...la) + pad, minLo = Math.min(...lo) - pad, maxLo = Math.max(...lo) + pad;
  const W = 470, H = 342, s = Math.min(W / (maxLo - minLo), H / (maxLa - minLa));
  const X = l => (l - minLo) * s + (W - (maxLo - minLo) * s) / 2, Y = l => H - ((l - minLa) * s + (H - (maxLa - minLa) * s) / 2);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[1]).toFixed(1)},${Y(p[0]).toFixed(1)}`).join(' ');
  const labels = [v.from, v.to].map((k, i) => { const c = city(k), p = c.ll; return `<g><circle cx="${X(p[1])}" cy="${Y(p[0])}" r="8" fill="${i ? '#dc2626' : '#16a34a'}" stroke="#fff" stroke-width="3"/>
    <text x="${X(p[1]) + 12}" y="${Y(p[0]) + 5}" font-size="15" font-weight="700" fill="#0f172a" font-family="IBM Plex Sans Arabic">${c.en}</text></g>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%"><rect width="${W}" height="${H}" fill="#cfe0ee"/>
    <path d="M0 ${H * .15} Q ${W * .4} ${H * .3} ${W * .55} ${H} L 0 ${H} Z" fill="#a9c9e2" opacity=".6"/>
    <path d="${path}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>${labels}</svg>`;
}

  else if (a === 'reset-demo') { db = seed(); save('*'); route(true); toast('أُعيدت البيانات التجريبية', 'fa-rotate'); }
  else if (a === 'add-company') {
    modal(`<h3 class="font-bold text-lg mb-1">إضافة شركة نقل</h3><p class="text-sm text-ink-500 mb-4">تحصل الشركة على حساب دخول خاص ولوحة لحافلاتها.</p>
      <form id="acForm" class="space-y-3" novalidate>
      <div class="field"><label for="acAr"><span>اسم الشركة بالعربية</span></label><input id="acAr" class="inp" placeholder="مثال: شركة الوفاء للنقل"></div>
      <div class="field"><label for="acEn"><span>اسم الشركة بالإنجليزية</span></label><input id="acEn" class="inp" dir="ltr" placeholder="Al-Wafa Transport"></div>
      <div class="grid grid-cols-2 gap-3"><div class="field"><label for="acUser"><span>اسم الدخول</span></label><input id="acUser" class="inp" dir="ltr" placeholder="wafa"></div>
      <div class="field"><label for="acPass"><span>كلمة المرور</span></label><input id="acPass" class="inp" dir="ltr" value="${Math.floor(1000 + Math.random() * 9000)}"></div></div>
      <p id="acErr" class="hidden text-xs text-red-600"></p>
      <div class="flex gap-2 pt-2"><button class="flex-1 py-3 rounded-xl bg-brand-600 text-white font-bold">إضافة الشركة</button><button type="button" data-action="close-modal" class="px-5 rounded-xl bg-ink-100 font-bold">إلغاء</button></div></form>`);
    setTimeout(() => $('#acAr').focus(), 50);
    $('#acForm').onsubmit = ev => { ev.preventDefault();
      const ar = $('#acAr').value.trim(), en = $('#acEn').value.trim(), u = $('#acUser').value.trim().toLowerCase(), pw = $('#acPass').value.trim(), err = $('#acErr');
      const bad = m => { err.textContent = m; err.classList.remove('hidden'); };
      if (!ar || !en) return bad('اكتب اسم الشركة بالعربية والإنجليزية');
      if (!/^[a-z0-9_-]{3,20}$/.test(u)) return bad('اسم الدخول: 3 أحرف إنجليزية أو أرقام على الأقل');
      if (u === PLATFORM.owner.user || db.companies.some(c => c.user === u || c.id === u)) return bad('اسم الدخول مستخدم من قبل');
      if (pw.length < 4) return bad('كلمة المرور 4 أحرف على الأقل');
      db.companies.push({ id: u, ar, en, logo: monogram(ar), user: u, pass: pw, active: true, since: toLocal(new Date()), vehicles: [] });
      save('*'); closeModal(); route(true); toast(`أُضيفت ${ar} — بيانات الدخول: ${u} / ${pw}`); };
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------------- INIT ---------------- */
route();
setInterval(() => { if (!scrCode && session && !location.hash.startsWith('#/edit') && !$('#modal').classList.contains('flex')) route(true); }, 30000);
</script>
</body>
</html>
